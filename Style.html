<style>

:root {
  --bg: #111111;
  --sidebar: #171717;
  --card: #1f1f1f;
  --card-hover: #292929;
  --border: #303030;
  --text: #ffffff;
  --muted: #999999;
  --accent: #ffa500;
}


* {
  box-sizing: border-box;
}


html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
}


body {
  overflow: hidden;
}


button {
  font-family: inherit;
}


/* =========================
   APP
   ========================= */

.app {
  display: flex;
  width: 100%;
  min-height: 100vh;
}


/* =========================
   SIDEBAR
   ========================= */

.sidebar {
  width: 220px;
  min-width: 220px;
  height: 100vh;

  background: var(--sidebar);

  border-right: 1px solid var(--border);

  display: flex;
  flex-direction: column;

  padding: 18px 12px;
}


/* =========================
   BRAND
   ========================= */

.brand {
  display: flex;
  align-items: center;

  gap: 10px;

  padding: 8px 8px 22px;
}


.brand-icon {
  width: 38px;
  height: 38px;

  border-radius: 11px;

  background: var(--accent);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 20px;
}


.brand-title {
  font-size: 15px;
  font-weight: 700;
}


.brand-subtitle {
  font-size: 10px;
  color: var(--muted);

  margin-top: 2px;
}


/* =========================
   NAVIGATION
   ========================= */

.navigation {
  display: flex;
  flex-direction: column;

  gap: 6px;
}


.nav-item {
  width: 100%;

  border: 0;

  background: transparent;

  color: #bbbbbb;

  padding: 11px 12px;

  border-radius: 9px;

  display: flex;
  align-items: center;

  gap: 10px;

  text-align: left;

  font-size: 12px;

  cursor: pointer;

  transition:
    background 0.15s ease,
    color 0.15s ease,
    transform 0.15s ease;
}


.nav-item:hover {
  background: var(--card-hover);
  color: white;
}


.nav-item.active {
  background: var(--card);
  color: white;
}


.nav-icon {
  width: 20px;

  text-align: center;

  font-size: 14px;
}


/* =========================
   SIDEBAR BOTTOM
   ========================= */

.sidebar-bottom {
  margin-top: auto;
}


/* =========================
   CONTENT
   ========================= */

.content {
  flex: 1;

  height: 100vh;

  overflow-y: auto;

  padding: 28px;
}


/* =========================
   PAGE
   ========================= */

.page {
  display: none;

  animation: fadeIn 0.15s ease;
}


.page.active {
  display: block;
}


.page h1 {
  margin: 0;

  font-size: 24px;
  font-weight: 700;
}


.page-description {
  margin-top: 7px;

  color: var(--muted);

  font-size: 12px;
}


/* =========================
   PLACEHOLDER
   ========================= */

.placeholder-card {
  margin-top: 24px;

  padding: 20px;

  border: 1px solid var(--border);

  border-radius: 12px;

  background: var(--card);

  color: var(--muted);

  font-size: 12px;
}


/* =========================
   ANIMATION
   ========================= */

@keyframes fadeIn {

  from {
    opacity: 0;
    transform: translateY(3px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

</style>
